<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact — TEAM DSR Executorrs LLP</title>
    <meta
      name="description"
      content="Contact TEAM DSR Executorrs LLP — exhibitions, events, and technology. Call +91 88666 65566 or email shail@teamdsr.co.in."
    />
    <link rel="icon" type="image/png" href="../assets/logo/favicon.png" />
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/pages/contact.css" />
  </head>
  <body class="page-contact">
    <a class="skip-link" href="#site-main">Skip to content</a>

    <div class="site-shell">
      <div id="site-header"></div>
      <div id="site-search"></div>

      <main id="site-main" class="contact-page" tabindex="-1">
        <div class="contact-page__atmosphere" aria-hidden="true">
          <span class="contact-page__blob contact-page__blob--a"></span>
        </div>

        <div class="contact-page__stage">
          <section class="contact-page__layout">
            <div class="contact-page__aside" data-reveal>
              <header class="contact-page__intro">
                <p class="contact-page__marker">Contact</p>
                <h1 class="contact-page__title">Get in touch</h1>
                <p class="contact-page__lede">
                  Tell us about your exhibition, event, or technology need —
                  we’ll respond with clarity.
                </p>
              </header>

              <ul class="contact-channels" data-contact-channels>
                <!-- Populated by contact.js -->
              </ul>

              <ul class="contact-pillars" data-contact-pillars aria-label="Focus areas">
                <!-- Populated by contact.js -->
              </ul>

              <figure class="contact-qr">
                <img
                  class="contact-qr__img"
                  src="../assets/img/contact/qr.png"
                  alt="QR code linking to www.teamdsr.co.in"
                  width="112"
                  height="112"
                  decoding="async"
                />
                <figcaption class="contact-qr__caption">
                  www.teamdsr.co.in
                </figcaption>
              </figure>
            </div>

            <section
              class="contact-form-card"
              data-reveal
              aria-labelledby="contact-form-heading"
            >
              <div class="contact-form-card__panel" data-form-panel>
                <h2 id="contact-form-heading" class="contact-form-card__title">
                  Send an enquiry
                </h2>
                <form class="contact-form" data-contact-form novalidate>
                  <div class="contact-form__field">
                    <label class="contact-form__label" for="contact-name">Name</label>
                    <input
                      class="contact-form__input"
                      id="contact-name"
                      name="name"
                      type="text"
                      autocomplete="name"
                      required
                    />
                    <p class="contact-form__error" id="error-name" hidden></p>
                  </div>

                  <div class="contact-form__field">
                    <label class="contact-form__label" for="contact-email">Email</label>
                    <input
                      class="contact-form__input"
                      id="contact-email"
                      name="email"
                      type="email"
                      autocomplete="email"
                      required
                    />
                    <p class="contact-form__error" id="error-email" hidden></p>
                  </div>

                  <div class="contact-form__field">
                    <label class="contact-form__label" for="contact-phone">Phone</label>
                    <input
                      class="contact-form__input"
                      id="contact-phone"
                      name="phone"
                      type="tel"
                      autocomplete="tel"
                    />
                  </div>

                  <div class="contact-form__field">
                    <label class="contact-form__label" for="contact-company">Company</label>
                    <input
                      class="contact-form__input"
                      id="contact-company"
                      name="company"
                      type="text"
                      autocomplete="organization"
                    />
                  </div>

                  <div class="contact-form__field">
                    <label class="contact-form__label" for="contact-message">Message</label>
                    <textarea
                      class="contact-form__input contact-form__textarea"
                      id="contact-message"
                      name="message"
                      rows="4"
                      required
                    ></textarea>
                    <p class="contact-form__error" id="error-message" hidden></p>
                  </div>

                  <button class="contact-form__submit" type="submit" data-submit>
                    Send enquiry
                  </button>
                </form>
              </div>

              <div class="contact-success" data-success-panel hidden>
                <div class="contact-success__icon" aria-hidden="true">
                  <svg width="36" height="36" viewBox="0 0 40 40" fill="none">
                    <circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="2" />
                    <path
                      d="m12 20.5 5 5 11-12"
                      stroke="currentColor"
                      stroke-width="2.25"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                </div>
                <h2 class="contact-success__title">Thank you</h2>
                <p class="contact-success__text">
                  We’ve received your enquiry. Our team will get back to you shortly.
                </p>
                <button
                  class="contact-form__submit contact-success__again"
                  type="button"
                  data-reset-form
                >
                  Send another
                </button>
              </div>
            </section>
          </section>
        </div>
      </main>

      <div id="site-footer"></div>
    </div>

    <script type="module" src="../js/app.js"></script>
    <script type="module" src="../js/pages/contact.js"></script>
  </body>
</html>
